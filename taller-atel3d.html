        function normalizeOrderStatus(rawStatus, total, paid) {
            const s = (rawStatus || '').trim();
            if (ORDER_STAGES.includes(s)) return s;
            if (s === 'Pagado / Completado' || s === 'Pagado' || s === 'Completado') return 'Cobrado';
            if (s === 'Entregado') return (Number(total || 0) - Number(paid || 0) <= 0.009 && Number(total || 0) > 0) ? 'Cobrado' : 'Por cobrar';
            if (s === 'Elaborado / Impreso' || s === 'Elaborado') return 'Impreso';
            if (s === 'En Impresión' || s === 'Pendiente') return 'Pedido nuevo';
            return 'Pedido nuevo';
        }

        function normalizeOrdersList(list) {
            return (Array.isArray(list) ? list : []).map(o => {
                const total = Number(o.total || 0);
                let paid = Number(o.paid || 0);
                const status = normalizeOrderStatus(o.status, total, paid);
                if (status === 'Cobrado' && total > 0 && paid < total) {
                    paid = total;
                }
                return {
                    ...o,
                    status,
                    total,
                    paid
                };
            });
        }

        let storeConfig = JSON.parse(localStorage.getItem('atel_store_config')) || defaultStoreConfig;
        let filaments = JSON.parse(localStorage.getItem('atel_filaments')) || defaultFilaments;
        let products = JSON.parse(localStorage.getItem('atel_products_v2')) || defaultProducts;
        let pendingOrders = JSON.parse(localStorage.getItem('atel_pending_orders') || '[]');
        let orders = [];
        let db = null;
        let isApplyingRemote = false;
        let localWriteLockUntil = 0;

        if (localStorage.getItem('atel_orders_seed_version') !== INVENTORY_SEED_VERSION) {
            orders = normalizeOrdersList(csvInitialOrders);
            localStorage.setItem('atel_orders', JSON.stringify(orders));
            localStorage.setItem('atel_orders_seed_version', INVENTORY_SEED_VERSION);
        } else {
            const storedOrders = JSON.parse(localStorage.getItem('atel_orders') || 'null');
            orders = normalizeOrdersList(storedOrders && storedOrders.length ? storedOrders : csvInitialOrders);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('atel_unlocked') === '1') {
                showWorkshop();
            }
            lucide.createIcons();
        });

        function unlockWorkshop(e) {
            e.preventDefault();
            const savedPass = localStorage.getItem('atel_workshop_pass') || DEFAULT_PASS;
            const input = document.getElementById('workshopPasswordInput').value;
            if (input === savedPass) {
                sessionStorage.setItem('atel_unlocked', '1');
                document.getElementById('lockError').classList.add('hidden');
                showWorkshop();
            } else {
                document.getElementById('lockError').classList.remove('hidden');
            }
        }

        function lockWorkshop() {
            sessionStorage.removeItem('atel_unlocked');
            location.reload();
        }

        function showWorkshop() {
            document.getElementById('lockScreen').classList.add('hidden');
            document.getElementById('workshopApp').classList.remove('hidden');
            initFirebase();
            initCrossTabSync();
            populateQuoteFilaments();
            calculateQuote();
            renderOnlineAlerts();
            renderOrders();
            renderFilaments();
            renderInventoryProducts();
            renderAdminCatalog();
            loadStoreSettingsUI();
            lucide.createIcons();
        }

        function initCrossTabSync() {
            window.addEventListener('storage', (event) => {
                if (!event.key) return;
                if (event.key === 'atel_pending_orders') {
                    pendingOrders = JSON.parse(event.newValue || '[]');
                    renderOnlineAlerts();
                } else if (event.key === 'atel_filaments') {
                    filaments = JSON.parse(event.newValue || '[]');
                    populateQuoteFilaments();
                    renderFilaments();
                } else if (event.key === 'atel_products_v2') {
                    products = JSON.parse(event.newValue || '[]');
                    renderInventoryProducts();
                    renderAdminCatalog();
                } else if (event.key === 'atel_orders') {
                    orders = normalizeOrdersList(JSON.parse(event.newValue || '[]'));
                    renderOrders();
                }
            });
        }

        function switchTab(tabName) {
            ['cotizador', 'pedidos', 'inventario', 'catalogo'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('tab-active');
                btn.classList.add('text-slate-400');
            });
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('text-slate-400');
            if (tabName === 'pedidos') {
                renderOnlineAlerts();
                renderOrders();
            } else if (tabName === 'inventario') {
                renderFilaments();
                renderInventoryProducts();
            }
            lucide.createIcons();
        }

        function syncAvailableColorsToStore() {
            const available = filaments
                .filter(f => Number(f.grams) > 0)
                .map(f => ({
                    id: f.id,
                    type: f.type,
                    color: f.color,
                    grams: Number(f.grams)
                }));
            localStorage.setItem('atel_available_filaments', JSON.stringify(available));
            return available;
        }

        function saveData(options = { pushOrders: true }) {
            localWriteLockUntil = Date.now() + 4000;
            try {
                localStorage.setItem('atel_store_config', JSON.stringify(storeConfig));
                localStorage.setItem('atel_filaments', JSON.stringify(filaments));
                localStorage.setItem('atel_products_v2', JSON.stringify(products));
                localStorage.setItem('atel_orders', JSON.stringify(orders));
                localStorage.setItem('atel_pending_orders', JSON.stringify(pendingOrders));
            } catch (storageErr) {
                alert('Aviso: El almacenamiento local del navegador está lleno (posiblemente por demasiadas fotos pesadas). Usa imágenes más ligeras o URLs externas.');
                console.error('Error en localStorage:', storageErr);
            }
            const availableFilaments = syncAvailableColorsToStore();

            if (db && !isApplyingRemote) {
                const workshopPayload = {
                    filaments,
                    pendingOrders,
                    updatedAt: new Date().toISOString()
                };
                if (options.pushOrders !== false) {
                    workshopPayload.orders = orders;
                }
                db.collection('atel3d').doc('workshop').set(workshopPayload, { merge: true }).catch(err => {
                    console.error('Error sincronizando workshop en Firebase:', err);
                });

                db.collection('atel3d').doc('store').set({
                    storeConfig,
                    products,
                    availableFilaments,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).then(() => {
                    document.getElementById('cloudDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
                }).catch(err => {
                    console.error('Error guardando catálogo en Firebase:', err);
                    document.getElementById('cloudDot').className = 'w-2 h-2 rounded-full bg-rose-400';
                    alert('Se guardó en este dispositivo, pero la nube Firebase rechazó la actualización (' + (err.message || err.code) + '). Si subiste varias fotos desde archivo, prueba con fotos más ligeras o URLs.');
                });
            }
        }

        // ================= ALERTAS DE PEDIDOS NUEVOS DESDE LA WEB =================

        function acceptOnlineAlert(alertId) {
            const idx = pendingOrders.findIndex(a => a.id === alertId);
            if (idx < 0) return;
            const al = pendingOrders[idx];
            orders.unshift({
                id: 'ord_' + Date.now(),
                client: al.client,
                contact: al.contact || '',
                productId: al.productId || '',
                productName: al.productName,
                filament: al.filament || 'PLA',
                colors: al.colors || ['', '', '', ''],
                qty: Number(al.qty) || 1,
                total: Number(al.total) || 0,
                paid: Number(al.paid) || 0,
                deliveryDate: al.deliveryDate || new Date().toISOString().split('T')[0],
                status: 'Pedido nuevo',
                notes: al.notes || ''
            });
            pendingOrders.splice(idx, 1);
            saveData();
            renderOnlineAlerts();
            renderOrders();
        }

        function dismissOnlineAlert(alertId) {
            pendingOrders = pendingOrders.filter(a => a.id !== alertId);
            saveData({ pushOrders: false });
            renderOnlineAlerts();
        }

        function dismissAllOnlineAlerts() {
            if (!confirm('¿Descartar todas las notificaciones pendientes de la tienda web?')) return;
            pendingOrders = [];
            saveData({ pushOrders: false });
            renderOnlineAlerts();
        }

        // ================= COTIZADOR MULTICOLOR =================
        function populateQuoteFilaments() {
            for (let slot = 0; slot < 4; slot++) {
                const sel = document.getElementById(`qFil_${slot}`);
                if (!sel) continue;
                const prev = sel.value;
                const optionsHtml = filaments.map(f => `<option value="${f.id}">${f.type} — ${f.color} ($${(f.cost / 1000).toFixed(3)}/g | Disp: ${f.grams}g)</option>`).join('');
                sel.innerHTML = slot === 0
                    ? optionsHtml
                    : `<option value="">-- Ninguno --</option>` + optionsHtml;
                if (prev && [...sel.options].some(o => o.value === prev)) {
                    sel.value = prev;
                } else if (slot === 0 && filaments[0]) {
                    sel.value = filaments[0].id;
                } else {
                    sel.value = "";
                }
            }
        }

        function calculateQuote() {
            let totalGramsPerUnit = 0;
            let matCostPerUnit = 0;
            const breakdownParts = [];

            for (let slot = 0; slot < 4; slot++) {
                const filId = document.getElementById(`qFil_${slot}`)?.value;
                const g = Math.max(0, parseFloat(document.getElementById(`qGrams_${slot}`)?.value) || 0);
                if (filId && g > 0) {
                    const fil = filaments.find(f => f.id === filId) || filaments[0];
                    if (fil) {
                        const costPerGram = (fil.cost || 22) / 1000;
                        totalGramsPerUnit += g;
                        matCostPerUnit += g * costPerGram;
                        breakdownParts.push(`${g}g ${fil.color}`);
                    }
                }
            }

            const hrs = parseFloat(document.getElementById('quoteHours').value) || 0;
            const mins = parseFloat(document.getElementById('quoteMins').value) || 0;
            const qty = Math.max(1, parseInt(document.getElementById('quoteQty').value) || 1);
            const designCost = parseFloat(document.getElementById('quoteDesignCost').value) || 0;
            const margin = parseFloat(document.getElementById('quoteMargin').value) || 60;
            const watts = parseFloat(document.getElementById('cfgWatts').value) || 150;
            const kwhPrice = parseFloat(document.getElementById('cfgKwh').value) || 0.10;
            const wearPerHour = parseFloat(document.getElementById('cfgWear').value) || 0.25;

            document.getElementById('marginDisplay').textContent = `${margin}%`;
            document.getElementById('totalGramsBadge').textContent = `Total: ${totalGramsPerUnit} g/u`;

            const totalHours = hrs + (mins / 60);
            const matCost = matCostPerUnit * qty;
            const elecCost = (watts / 1000) * totalHours * kwhPrice * qty;
            const wearCost = totalHours * wearPerHour * qty;
            const baseCost = matCost + elecCost + wearCost + designCost;
            const clientTotal = baseCost * (1 + margin / 100);
            const clientUnit = clientTotal / qty;
            const profit = clientTotal - baseCost;

            document.getElementById('resClientTotal').textContent = `$${clientTotal.toFixed(2)}`;
            document.getElementById('resClientUnit').textContent = `$${clientUnit.toFixed(2)}`;
            document.getElementById('resGramsBreakdown').textContent = breakdownParts.length ? breakdownParts.join(' + ') : '0g';
            document.getElementById('resHoursBreakdown').textContent = `${(totalHours * qty).toFixed(1)}h`;
            document.getElementById('resMatCost').textContent = `$${matCost.toFixed(2)}`;
            document.getElementById('resElecCost').textContent = `$${elecCost.toFixed(2)}`;
            document.getElementById('resWearCost').textContent = `$${wearCost.toFixed(2)}`;
            document.getElementById('resExtraCost').textContent = `$${designCost.toFixed(2)}`;
            document.getElementById('resBaseCost').textContent = `$${baseCost.toFixed(2)}`;
            document.getElementById('resProfit').textContent = `$${profit.toFixed(2)}`;
        }

        function copyQuoteText() {
            const name = document.getElementById('quoteName').value || 'Pieza 3D Personalizada';
            const qty = document.getElementById('quoteQty').value;
            const total = document.getElementById('resClientTotal').textContent;
            const unit = document.getElementById('resClientUnit').textContent;
            const cols = [];
            for (let s = 0; s < 4; s++) {
                const filId = document.getElementById(`qFil_${s}`)?.value;
                const g = parseFloat(document.getElementById(`qGrams_${s}`)?.value) || 0;
                if (filId && g > 0) {
                    const f = filaments.find(x => x.id === filId);
                    if (f) cols.push(`${f.color} (${f.type})`);
                }
            }
            const colorLine = cols.length ? `• Colores: ${cols.join(', ')}\n` : '';
            const text = `Cotización ATEL 3D — Ideas que toman forma\n• Proyecto: ${name}\n${colorLine}• Cantidad: ${qty} u.\n• Precio Unitario: ${unit}\n• Total: ${total}\n¡Quedamos atentos para iniciar producción!`;
            navigator.clipboard?.writeText(text).then(() => alert('Cotización copiada al portapapeles.'));
        }

        // ================= PEDIDOS (4 ETAPAS + BLOQUEO AL COBRAR) =================
        function getInventoryColorsForMaterial(mat) {
            const cleanMat = (mat || 'PLA').toLowerCase().trim();
            const inStock = filaments.filter(f => Number(f.grams) > 0);
            let cols = inStock.filter(f => (f.type || 'PLA').toLowerCase().trim() === cleanMat).map(f => f.color).filter(Boolean);
            if (!cols.length && inStock.length) {
                cols = inStock.map(f => f.color).filter(Boolean);
            }
            if (!cols.length) {
                cols = filaments.map(f => f.color).filter(Boolean);
            }
            return [...new Set(cols)];
        }

        function updateOrderColorDropdowns(presetColors = null) {
            const mat = document.getElementById('ordFilament').value || 'PLA';
            const cols = getInventoryColorsForMaterial(mat);
            for (let i = 0; i < 4; i++) {
                const sel = document.getElementById(`ordColor_${i}`);
                if (!sel) continue;
                const currentVal = presetColors ? (presetColors[i] || '') : sel.value;
                const allOptions = currentVal && !cols.includes(currentVal) ? [currentVal, ...cols] : cols;
                sel.innerHTML = `<option value="">-- Ninguno --</option>` + allOptions.map(c => `<option value="${c}">${c}</option>`).join('');
                sel.value = currentVal || '';
            }
        }

        function setOrderStatusFilter(status) {
            const sel = document.getElementById('filterOrderStatus');
            if (sel) {
                sel.value = (sel.value === status) ? 'ALL' : status;
                renderOrders();
            }
        }

        function renderOrders() {
            const list = document.getElementById('ordersList');
            const filter = document.getElementById('filterOrderStatus').value;
            const search = document.getElementById('searchOrder').value.toLowerCase();
            list.innerHTML = '';

            let rev = 0, paid = 0, bal = 0;
            let countNew = 0, countPrinted = 0, countToCollect = 0, countCollected = 0;

            orders.forEach(o => {
                rev += Number(o.total || 0);
                paid += Number(o.paid || 0);
                bal += Math.max(0, Number(o.total || 0) - Number(o.paid || 0));
                if (o.status === 'Pedido nuevo') countNew++;
                else if (o.status === 'Impreso') countPrinted++;
                else if (o.status === 'Por cobrar') countToCollect++;
                else if (o.status === 'Cobrado') countCollected++;
            });

            document.getElementById('statTotalRevenue').textContent = `$${rev.toFixed(2)}`;
            document.getElementById('statTotalPaid').textContent = `$${paid.toFixed(2)}`;
            document.getElementById('statTotalBalance').textContent = `$${bal.toFixed(2)}`;

            document.getElementById('stageCountNew').textContent = countNew;
            document.getElementById('stageCountPrinted').textContent = countPrinted;
            document.getElementById('stageCountToCollect').textContent = countToCollect;
            document.getElementById('stageCountCollected').textContent = countCollected;

            const filtered = orders.filter(o => {
                const matchStatus = filter === 'ALL' || o.status === filter;
                const colsText = (o.colors || []).join(' ').toLowerCase();
                const notesText = (o.notes || '').toLowerCase();
                const matchSearch = (o.client || '').toLowerCase().includes(search) ||
                                    (o.productName || '').toLowerCase().includes(search) ||
                                    colsText.includes(search) ||
                                    notesText.includes(search);
                return matchStatus && matchSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="col-span-full bg-dark-900 border border-slate-800 rounded-2xl p-8 text-center text-xs text-slate-400">No hay pedidos en esta vista.</div>`;
                return;
            }

            const statusColors = {
                'Pedido nuevo': 'bg-amber-500/15 text-amber-300 border-amber-500/30',
                'Impreso': 'bg-sky-500/15 text-sky-300 border-sky-500/30',
                'Por cobrar': 'bg-purple-500/15 text-purple-300 border-purple-500/30',
                'Cobrado': 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
            };

            const nextStepConfig = {
                'Pedido nuevo': { next: 'Impreso', label: 'Marcar Impreso', btnClass: 'bg-sky-600/20 hover:bg-sky-600/35 text-sky-300 border border-sky-500/40' },
                'Impreso': { next: 'Por cobrar', label: 'Pasar a Por cobrar', btnClass: 'bg-purple-600/20 hover:bg-purple-600/35 text-purple-300 border border-purple-500/40' },
                'Por cobrar': { next: 'Cobrado', label: 'Marcar Cobrado y Cerrar', btnClass: 'bg-emerald-600/20 hover:bg-emerald-600/35 text-emerald-300 border border-emerald-500/40' }
            };

            filtered.forEach(o => {
                const balance = Math.max(0, Number(o.total) - Number(o.paid));
                const activeCols = (o.colors || []).filter(Boolean);
                const colorBadges = activeCols.length
                    ? activeCols.map(c => `<span class="text-[10px] bg-slate-800 border border-slate-700 text-slate-200 px-2 py-0.5 rounded-md">${c}</span>`).join('')
                    : `<span class="text-[10px] text-slate-500">Sin color asignado</span>`;

                const isLocked = o.status === 'Cobrado';
                const nextStep = nextStepConfig[o.status];

                const footerControls = isLocked
                    ? `<div class="pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
                            <span class="inline-flex items-center gap-1.5 text-emerald-400 font-semibold">
                                <i data-lucide="lock" class="w-3.5 h-3.5"></i> Pedido cerrado y cobrado
                            </span>
                            <span class="text-[11px] text-slate-500">No modificable</span>
                       </div>`
                    : `<div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800 text-xs">
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="editOrder('${o.id}')" class="text-slate-300 hover:text-white">Editar</button>
                                <button type="button" onclick="deleteOrder('${o.id}')" class="text-rose-400 hover:underline">Eliminar</button>
                            </div>
                            ${nextStep ? `<button type="button" onclick="advanceOrderStatus('${o.id}')" class="${nextStep.btnClass} px-2.5 py-1 rounded-lg text-[11px] font-semibold transition">${nextStep.label} →</button>` : ''}
                       </div>`;

                const card = document.createElement('div');
                card.className = `bg-dark-900 border ${isLocked ? 'border-emerald-900/50' : 'border-slate-800'} rounded-2xl p-4 space-y-3`;
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <h4 class="font-bold text-white text-sm">${o.client}</h4>
                            <p class="text-xs text-brand-400 font-medium">${o.productName} (${o.qty} u.)</p>
                        </div>
                        <span class="text-[11px] px-2.5 py-0.5 rounded-full border font-semibold whitespace-nowrap ${statusColors[o.status] || statusColors['Pedido nuevo']}">${o.status}</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5">
                        <span class="text-[10px] font-bold bg-brand-600/20 text-brand-300 border border-brand-500/30 px-2 py-0.5 rounded-md">${o.filament || 'PLA'}</span>
                        ${colorBadges}
                    </div>
                    ${o.notes ? `<p class="text-xs text-slate-400 bg-slate-800/50 p-2 rounded-lg">${o.notes}</p>` : ''}
                    <div class="flex justify-between text-xs text-slate-300 pt-1">
                        <span>Total: <b>$${Number(o.total).toFixed(2)}</b></span>
                        <span>Cobrado: <b class="text-emerald-400">$${Number(o.paid).toFixed(2)}</b></span>
                        <span>Saldo: <b class="${balance > 0 ? 'text-amber-400' : 'text-slate-400'}">$${balance.toFixed(2)}</b></span>
                    </div>
                    <div class="text-[11px] text-slate-500 flex items-center justify-between">
                        <span>Entrega: ${o.deliveryDate || 'Sin fecha'}</span>
                        ${o.contact ? `<span>Tel: ${o.contact}</span>` : ''}
                    </div>
                    ${footerControls}
                `;
                list.appendChild(card);
            });
            lucide.createIcons();
        }

        function advanceOrderStatus(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            if (o.status === 'Cobrado') {
                alert('Este pedido ya está en estado Cobrado y no puede modificarse.');
                return;
            }
            if (o.status === 'Pedido nuevo') {
                o.status = 'Impreso';
            } else if (o.status === 'Impreso') {
                o.status = 'Por cobrar';
            } else if (o.status === 'Por cobrar') {
                if (!confirm(`¿Confirmas que el pedido de ${o.client} por $${Number(o.total).toFixed(2)} ya fue cobrado?\n\nUna vez marcado como "Cobrado", el pedido quedará bloqueado y no se podrá volver a modificar.`)) {
                    return;
                }
                o.paid = Number(o.total || 0);
                o.status = 'Cobrado';
            }
            saveData();
            renderOrders();
        }

        function openOrderModal() {
            document.getElementById('orderModalTitle').textContent = 'Nuevo Pedido';
            document.getElementById('ordId').value = '';
            document.getElementById('ordClient').value = '';
            document.getElementById('ordContact').value = '';
            document.getElementById('ordProduct').value = '';
            document.getElementById('ordFilament').value = 'PLA';
            updateOrderColorDropdowns(['', '', '', '']);
            document.getElementById('ordQty').value = 1;
            document.getElementById('ordTotal').value = '';
            document.getElementById('ordPaid').value = 0;
            document.getElementById('ordStatus').value = 'Pedido nuevo';
            document.getElementById('ordNotes').value = '';

            const sel = document.getElementById('ordCatalogSelect');
            sel.innerHTML = `<option value="">-- Personalizado --</option>` + products.map(p => `<option value="${p.id}">${p.name} ($${Number(p.basePrice).toFixed(2)} c/u)</option>`).join('');

        function onOrderProductSelect() {
            const prodId = document.getElementById('ordCatalogSelect').value;
            const prod = products.find(p => p.id === prodId);
            if (!prod) return;
            document.getElementById('ordProduct').value = prod.name;
            document.getElementById('ordFilament').value = prod.filament || 'PLA';
            updateOrderColorDropdowns(prod.colors || ['', '', '', '']);
            onOrderQtyOrPriceChange();
        }

        function onOrderQtyOrPriceChange() {
            const prodId = document.getElementById('ordCatalogSelect').value;
            const prod = products.find(p => p.id === prodId);
            if (!prod) return;
            const q = Math.max(1, parseInt(document.getElementById('ordQty').value) || 1);
            let total = q * prod.basePrice;
            if (prod.packs && prod.packs.length > 0) {
                const exactPack = prod.packs.find(pk => parseInt(pk.qty) === q);
                if (exactPack) {
                    total = parseFloat(exactPack.price);
                } else if (q === 6) {
                    total = prod.pack6Price;
                } else if (q > 6) {
                    total = prod.pack6Price + ((q - 6) * prod.extraUnitPrice);
                }
            } else {
                if (q === 6) total = prod.pack6Price;
                else if (q > 6) total = prod.pack6Price + ((q - 6) * prod.extraUnitPrice);
            }
            document.getElementById('ordTotal').value = total.toFixed(2);
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        function saveOrder(e) {
            e.preventDefault();
            const id = document.getElementById('ordId').value;
            if (id) {
                const existing = orders.find(x => x.id === id);
                if (existing && existing.status === 'Cobrado') {
                    alert('Este pedido ya está en estado Cobrado y no puede modificarse.');
                    closeOrderModal();
                    return;
                }
            }

            const selectedStatus = document.getElementById('ordStatus').value;
            const totalVal = parseFloat(document.getElementById('ordTotal').value) || 0;
            let paidVal = parseFloat(document.getElementById('ordPaid').value) || 0;

            if (selectedStatus === 'Cobrado') {
                if (!confirm(`¿Confirmas guardar el pedido de ${document.getElementById('ordClient').value.trim()} como "Cobrado"?\n\nUna vez cobrado quedará bloqueado y no se podrá modificar más.`)) {
                    return;
                }
                paidVal = totalVal;
            }

            const obj = {
                id: id || 'ord_' + Date.now(),
                client: document.getElementById('ordClient').value.trim(),
                contact: document.getElementById('ordContact').value.trim(),
                productId: document.getElementById('ordCatalogSelect').value,
                productName: document.getElementById('ordProduct').value.trim(),
                filament: document.getElementById('ordFilament').value,
                colors: [
                    document.getElementById('ordColor_0').value,
                    document.getElementById('ordColor_1').value,
                    document.getElementById('ordColor_2').value,
                    document.getElementById('ordColor_3').value
                ],
                qty: parseInt(document.getElementById('ordQty').value) || 1,
                total: totalVal,
                paid: paidVal,
                deliveryDate: document.getElementById('ordDate').value,
                status: selectedStatus,
                notes: document.getElementById('ordNotes').value.trim()
            };
            if (id) {
                const idx = orders.findIndex(x => x.id === id);
                if (idx >= 0) orders[idx] = obj;
            } else {
                orders.unshift(obj);
            }
            saveData();
            renderOrders();
            closeOrderModal();
        }

        function editOrder(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            if (o.status === 'Cobrado') {
                alert('Este pedido ya está en estado Cobrado y no puede modificarse.');
                return;
            }
            openOrderModal();
            document.getElementById('orderModalTitle').textContent = 'Editar Pedido';
            document.getElementById('ordId').value = o.id;
            document.getElementById('ordClient').value = o.client;
            document.getElementById('ordContact').value = o.contact || '';
            document.getElementById('ordCatalogSelect').value = o.productId || '';
            document.getElementById('ordProduct').value = o.productName;
            document.getElementById('ordFilament').value = o.filament || 'PLA';
            updateOrderColorDropdowns(o.colors || ['', '', '', '']);
            document.getElementById('ordQty').value = o.qty;
            document.getElementById('ordTotal').value = o.total;
            document.getElementById('ordPaid').value = o.paid;
            document.getElementById('ordDate').value = o.deliveryDate;
            document.getElementById('ordStatus').value = o.status;
            document.getElementById('ordNotes').value = o.notes || '';
        }

        function deleteOrder(id) {
            const o = orders.find(x => x.id === id);
            if (o && o.status === 'Cobrado') {
                alert('Este pedido ya está en estado Cobrado y no puede eliminarse ni modificarse.');
                return;
            }
            if (!confirm('¿Eliminar este pedido?')) return;

        function exportOrdersCSV() {
            const headers = ['Cliente', 'Contacto', 'Producto', 'Cantidad', 'Color', 'Filamento', 'Notas', 'Fecha de entrega', 'Precio', 'Anticipo', 'Saldo', 'Estado'];
            const rows = orders.map(o => {
                const cols = (o.colors || []).filter(Boolean).join(', ');
                const bal = Math.max(0, Number(o.total || 0) - Number(o.paid || 0)).toFixed(2);
                return [
                    o.client || '',
                    o.contact || '',
                    o.productName || '',
                    o.qty || 1,
                    cols,
                    o.filament || 'PLA',
                    (o.notes || '').replace(/\n/g, ' '),
                    o.deliveryDate || '',
                    Number(o.total || 0).toFixed(2),
                    Number(o.paid || 0).toFixed(2),
                    bal,
                    o.status || ''
                ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
            });
            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pedidos-3d-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function handleProductPhotoUpload(idx, inputEl) {
            const file = inputEl.files && inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 480;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.68);
                    document.getElementById(`prodImage_${idx}`).value = compressedDataUrl;
                    setPhotoPreviewUI(idx, compressedDataUrl);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

                const q = parseInt(row.querySelector('.pack-qty').value);

                document.getElementById('prodImage_0').value.trim(),
                document.getElementById('prodImage_1').value.trim(),
                document.getElementById('prodImage_2').value.trim()

            const firstValidImg = imagesArr.find(u => u) || '';

            const colorLabels = [0, 1, 2, 3].map(i => document.getElementById(`prodColorLabel_${i}`).value.trim() || `Color ${i + 1}`);
            const colorsArr = [0, 1, 2, 3].map(i => i < colorCount ? document.getElementById(`prodColor_${i}`).value : '');

            const obj = {
                id: id || ('prod_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5)),
                name: document.getElementById('prodName').value.trim(),
                category: document.getElementById('prodCategory').value,
                filament: document.getElementById('prodFilament').value,
                colorCount,
                colorLabels,
                colors: colorsArr,

                basePrice: parseFloat(document.getElementById('prodBasePrice').value) || 1,
                pack6Price: parseFloat(document.getElementById('prodPack6').value) || 5,

                image: firstValidImg,
                featured: document.getElementById('prodFeatured').checked,

            };

            const existingIdx = id ? products.findIndex(x => x.id === id) : -1;
            if (existingIdx >= 0) {
                products[existingIdx] = obj;
            } else {
                products.push(obj);
            }

        function saveFirebaseConfig() {
            const raw = document.getElementById('firebaseConfigInput').value.trim();
            if (!raw) return;
            localStorage.setItem('atel_firebase_cfg', raw);
            initFirebase();
            saveData();
            closeCloudModal();
        }

        function initFirebase() {
            try {
                const cfg = resolveWorkshopFirebaseConfig();
                if (!cfg || !cfg.apiKey) return;
                if (!firebase.apps.length) firebase.initializeApp(cfg);
                db = firebase.firestore();
                document.getElementById('cloudDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
                document.getElementById('cloudLabel').textContent = `Nube: ${cfg.projectId || 'atel-3d'}`;

                db.collection('atel3d').doc('workshop').onSnapshot((doc) => {
                    if (!doc.exists || Date.now() < localWriteLockUntil) return;
                    const data = doc.data();
                    isApplyingRemote = true;
                    try {
                        if (Array.isArray(data.filaments) && data.filaments.length) {
                            filaments = data.filaments;
                            localStorage.setItem('atel_filaments', JSON.stringify(filaments));
                            syncAvailableColorsToStore();
                            populateQuoteFilaments();
                            renderFilaments();
                        }
                        if (Array.isArray(data.pendingOrders)) {
                            pendingOrders = data.pendingOrders;
                            localStorage.setItem('atel_pending_orders', JSON.stringify(pendingOrders));
                            renderOnlineAlerts();
                        }
                        if (Array.isArray(data.orders) && data.orders.length) {
                            const remoteSeed = data.seedVersion || '';
                            if (remoteSeed === INVENTORY_SEED_VERSION || localStorage.getItem('atel_remote_orders_synced') === '1') {
                                orders = normalizeOrdersList(data.orders);
                                localStorage.setItem('atel_orders', JSON.stringify(orders));
                                renderOrders();
                            }
                        }
                    } finally {
                        isApplyingRemote = false;
                    }
                });

                db.collection('atel3d').doc('store').onSnapshot((doc) => {
                    if (!doc.exists || Date.now() < localWriteLockUntil) return;
                    const data = doc.data();
                    isApplyingRemote = true;
                    try {
                        if (data.storeConfig) {
                            storeConfig = { ...defaultStoreConfig, ...data.storeConfig };
                            localStorage.setItem('atel_store_config', JSON.stringify(storeConfig));
                            loadStoreSettingsUI();
                        }
                        if (Array.isArray(data.products) && data.products.length) {
                            products = data.products;
                            localStorage.setItem('atel_products_v2', JSON.stringify(products));
                            renderInventoryProducts();
                            renderAdminCatalog();
                        }
                    } finally {
                        isApplyingRemote = false;
                    }
                });

                db.collection('atel3d').doc('workshop').set({
                    orders,
                    filaments,
                    pendingOrders,
                    seedVersion: INVENTORY_SEED_VERSION,
                    updatedAt: new Date().toISOString()
                }, { merge: true }).catch(err => console.warn('Sync workshop inicial:', err));
                localStorage.setItem('atel_remote_orders_synced', '1');
            } catch (err) {
                console.error(err);
                document.getElementById('cloudDot').className = 'w-2 h-2 rounded-full bg-amber-400';
                document.getElementById('cloudLabel').textContent = 'Nube: Local';
            }
        }
    </script>
